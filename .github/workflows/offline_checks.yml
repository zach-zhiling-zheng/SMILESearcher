name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[notebook]"
      - run: python -m unittest discover -s tests -v
      - run: python app.py --csv examples/top20_linkers_input.csv --cache examples/top20_linkers_cache.json --out results/top20_linkers.csv --offline --molecular-weight
      - run: python -m jupyter nbconvert --to notebook --execute examples/top20_linkers_demo.ipynb --output top20_linkers_executed.ipynb --output-dir results --ExecutePreprocessor.timeout=180
