[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smilesearcher"
version = "0.2.0"
description = "Validated chemical name-to-SMILES lookup for MOF and building-block tables"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "SMILESearcher contributors"}]
dependencies = ["pandas>=1.5", "requests>=2.28", "rdkit>=2023.9"]

[project.urls]
Repository = "https://github.com/zach-zhiling-zheng/SMILESearcher"
Documentation = "https://github.com/zach-zhiling-zheng/SMILESearcher/blob/main/docs/usage.md"
Issues = "https://github.com/zach-zhiling-zheng/SMILESearcher/issues"

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5.7", "nbclient>=0.8"]

[project.scripts]
smilesearcher = "smilesearcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
